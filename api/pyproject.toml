[project]
name = "job-auto-apply-api"
version = "0.1.0"
description = "Backend for job-auto-apply: profiles, resume parsing, LLM layer, LaTeX rendering"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "email-validator>=2.2",
  "pyjwt>=2.9",
  "pwdlib[argon2]>=0.2",
  "python-multipart>=0.0.9",
  "celery[redis]>=5.4",
  "boto3>=1.35",
  "google-genai>=1.0",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "pdfplumber>=0.11",
  "pypdf>=5.0",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["llm/prompts/*.md", "rendering/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
