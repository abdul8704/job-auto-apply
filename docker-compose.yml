# Local and single-server (EC2) setup: API, worker, Postgres, Redis.
#   cp .env.example .env   # then add GEMINI_API_KEY and a JWT_SECRET
#   docker compose up --build
x-app: &app
  build: ./api
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/app
    REDIS_URL: redis://redis:6379/0
    CELERY_EAGER: "false"
    AUTO_CREATE_TABLES: "false"
    LOCAL_STORAGE_DIR: /srv/data/files
  volumes:
    - files:/srv/data
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_started }

services:
  api:
    <<: *app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]

  worker:
    <<: *app
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2

  postgres:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app }
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine

volumes:
  pgdata:
  files:
